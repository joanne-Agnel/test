<head>
    <link rel="stylesheet" href="PerfectDay.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Chewy&display=swap" rel="stylesheet">

<body>
    <h1>Build Your Perfect Day!!</h1>
    Find an activity and a buddy to do it with!

    <div class="interests">
        <h2>Choose Your Interests-</h2>
        <button onclick="Art()">Art</button>
        <button onclick="Music()">Music</button>
        <button onclick="Coding()">Coding</button>
        <button onclick="Dance()">Dance</button>
        <button onclick="Baking()">Baking</button>
        <button onclick="Fashion()">Fashion</button>
        <button onclick="Gardening()">Gardening</button>
        <button onclick="Languages()">Languages</button>
        <button onclick="DIY()">DIY</button>
        <button onclick="Photography()">Photography</button>
        <button onclick="Writing()">Writing</button>
        <button onclick="Hiking()">Hiking</button>
        <button onclick="Sports()">Sports</button>
        <button onclick="Other()">Other</button>
        <br>
        <button onclick="Done()">Finished!</button>
    </div>

    <h2>Get Your Activites-</h2>
    <div class="Activites">
        <button id="Art">Art Gallery</button>
        <button id="Music">Concert</button>
        <button id="Coding">Hackathon</button>
        <button id="Dance">Dance Battle</button>
        <button id="Baking">Baked Goods Sale</button>
        <button id="Fashion">Outfit Exchange</button>
        <button id="Gardening">Community Garden</button>
        <button id="Languages">Language Exchange</button>
        <button id="DIY">Gift Making</button>
        <button id="Photography">Photoshoot</button>
        <button id="Writing">Write Short Stories</button>
        <button id="Hiking">Hike Together</button>
        <button id="Sports">Obstacle Course</button>
        <button id="Other">One of the above!</button>
    </div>
    <br>
    <button id="Done">Finished!</button>


    <p id="hi">hello</p>
    <script src="PerfectDay.js"></script>
